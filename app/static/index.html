<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Analyzer</title>
<style>
  :root {
    --bg:#f8fafc; --panel:#fff; --line:#e2e8f0; --fg:#0f172a; --dim:#64748b; --accent:#2563eb;
    --purple:#a855f7; --teal:#0f766e;
    --issue:rgba(239,68,68,.30); --issue-b:#dc2626;
    --good:rgba(34,197,94,.32); --good-b:#16a34a;
    --style:rgba(245,158,11,.35); --style-b:#d97706;
    --visual:rgba(99,102,241,.28); --visual-b:#6366f1;
    --page-shadow:0 1px 4px rgba(15,23,42,.18);
  }
  html[data-theme="dark"] {
    --bg:#0b1220; --panel:#101826; --line:#263244; --fg:#e2e8f0; --dim:#8fa1b7; --accent:#60a5fa;
    --purple:#c084fc; --teal:#2dd4bf;
    --issue:rgba(248,113,113,.40); --issue-b:#f87171;
    --good:rgba(52,211,153,.40); --good-b:#34d399;
    --style:rgba(251,191,36,.45); --style-b:#fbbf24;
    --visual:rgba(129,140,248,.40); --visual-b:#818cf8;
    --page-shadow:0 2px 10px rgba(0,0,0,.55);
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  button, .btn { font:inherit; font-size:12px; padding:3px 9px; border:1px solid var(--line);
         border-radius:6px; background:var(--panel); color:var(--fg); cursor:pointer; text-decoration:none; }
  button:hover, .btn:hover { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .dim { color:var(--dim); font-size:12px; }

  /* ---------- header: title + resume tabs ---------- */
  header { display:flex; align-items:center; gap:12px; padding:0 14px; height:46px;
           border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:15px; margin:0; white-space:nowrap; font-weight:700; }
  #tabs { display:flex; align-items:center; gap:5px; flex:1; min-width:0; height:100%;
          overflow-x:auto; overflow-y:hidden; scrollbar-width:thin; }
  .rtab { display:flex; align-items:center; gap:6px; height:30px; padding:0 3px 0 12px;
          border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg);
          cursor:pointer; max-width:230px; flex:0 0 auto; }
  .rtab:hover { border-color:var(--accent); }
  .rtab.on { border-color:var(--accent); color:var(--accent); background:var(--panel);
             box-shadow:0 0 0 1px var(--accent); }
  .rtab .tname { font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rtab .kebab { border:none; background:none; font-size:13px; line-height:1; padding:3px 6px;
                 border-radius:5px; color:var(--dim); cursor:pointer; }
  .rtab .kebab:hover { color:var(--accent); background:var(--bg); }
  .rtab .doterr { width:8px; height:8px; border-radius:50%; background:var(--issue-b); flex:0 0 auto; }
  .rtab .spinner { width:10px; height:10px; flex:0 0 auto; }
  .rtab.plus { padding:0 13px; font-size:15px; font-weight:600; color:var(--dim); }
  .rtab.plus:hover { color:var(--accent); }
  #file { display:none; }
  #themeBtn { flex:0 0 auto; }

  /* ---------- tab kebab menu ---------- */
  #menu { position:fixed; z-index:50; background:var(--panel); border:1px solid var(--line);
          border-radius:10px; padding:4px; min-width:190px; box-shadow:0 10px 30px rgba(0,0,0,.20); }
  #menu button { display:block; width:100%; text-align:left; padding:6px 10px; border:none;
                 background:none; border-radius:6px; font:inherit; font-size:12.5px; }
  #menu button:hover { background:var(--bg); }
  #menu button.danger { color:var(--issue-b); }
  #menu .sep { height:1px; background:var(--line); margin:4px 2px; }

  /* ---------- layout (responsive via grid areas) ---------- */
  .wrap { display:grid; grid-template-columns:340px minmax(0,1fr) 380px;
          grid-template-areas:"analysis pdf chat"; height:calc(100vh - 46px); }
  @media (max-width:1400px) {
    .wrap { grid-template-columns:300px minmax(0,1fr) 340px; }
  }
  @media (max-width:1100px) {
    /* Tablet: analysis + PDF side by side, chat as a full-width bottom row. */
    .wrap { grid-template-columns:290px minmax(0,1fr);
            grid-template-rows:minmax(0,1fr) minmax(220px,42%);
            grid-template-areas:"analysis pdf" "chat chat"; }
  }
  @media (max-width:760px) {
    /* Phone: single stacked column, the page itself scrolls. */
    .wrap { grid-template-columns:minmax(0,1fr); grid-template-rows:auto;
            grid-template-areas:"pdf" "analysis" "chat"; height:auto; }
    body { overflow:auto; }
    #pdfPane { height:64vh; }
    #analysis { border-right:none; border-top:1px solid var(--line); }
    #chatPane { height:56vh; border-left:none; border-top:1px solid var(--line); }
  }
  @media (max-width:640px) {
    header { padding:0 8px; gap:8px; }
    header h1 { font-size:13px; }
    .tabs { padding:10px 10px 0; }
    #pdfPages { padding:10px; }
  }

  /* ---------- left: analysis ---------- */
  #analysis { grid-area:analysis; border-right:1px solid var(--line); padding:14px;
              background:var(--panel); overflow:auto; }
  #analysis.stale .scorebox, #analysis.stale .bars, #analysis.stale .card, #analysis.stale .filters,
  #analysis.stale details { opacity:.55; }
  .stat { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--accent);
          margin-bottom:10px; }
  .stat.dim { color:var(--dim); }
  .models { margin-bottom:10px; }
  .scorebox { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .ring { width:56px; height:56px; flex:0 0 56px; border-radius:50%; display:grid; place-items:center;
          font-weight:700; font-size:17px;
          background:conic-gradient(var(--c) calc(var(--p)*1%), var(--line) 0); position:relative; }
  .ring::before { content:""; position:absolute; inset:6px; border-radius:50%; background:var(--panel); }
  .ring span { position:relative; }
  .bars { margin:6px 0 12px; }
  .bar { display:grid; grid-template-columns:82px 1fr 36px; gap:6px; align-items:center;
         font-size:12px; margin:3px 0; }
  .bar span:last-child { white-space:nowrap; text-align:right; }
  .bar .track { height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar .fill { height:100%; border-radius:3px; }
  .filters { display:flex; gap:5px; margin:8px 0; flex-wrap:wrap; }
  .filters button.on { border-color:var(--accent); color:var(--accent); }
  .card { border:1px solid var(--line); border-left:4px solid var(--b); border-radius:8px;
          padding:8px 10px; margin-bottom:8px; cursor:pointer; }
  .card.issue { --b:var(--issue-b); } .card.strength { --b:var(--good-b); }
  .card.style { --b:var(--style-b); } .card.visual { --b:var(--visual-b); }
  .card.active { box-shadow:0 0 0 2px var(--accent); }
  .card .t { font-weight:600; font-size:13px; }
  .card .meta { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.03em; }
  .card .body { display:none; margin-top:6px; font-size:13px; }
  .card.active .body { display:block; }
  .diff { margin-top:6px; border-radius:6px; overflow:hidden; font-size:12.5px; }
  .diff div { padding:4px 8px; white-space:pre-wrap; }
  .diff .del { background:rgba(239,68,68,.12); text-decoration:line-through;
               text-decoration-color:rgba(220,38,38,.6); }
  .diff .add { background:rgba(34,197,94,.14); }
  .card .acts { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .unanchored { font-size:11px; color:var(--style-b); }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0 12px; }
  .chip { font-size:11.5px; padding:1px 7px; border-radius:10px; border:1px solid var(--line); }
  details summary { cursor:pointer; font-size:12px; color:var(--dim); text-transform:uppercase; margin-top:8px; }
  .err { color:#b91c1c; white-space:pre-wrap; font-size:13px; }
  .ph { color:var(--dim); text-align:center; margin-top:40px; }
  .spinner { width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent);
             border-radius:50%; animation:r .8s linear infinite; display:inline-block; vertical-align:middle; }
  @keyframes r { to { transform:rotate(360deg); } }

  /* ---------- middle: PDF / Source ---------- */
  #pdfPane { grid-area:pdf; display:flex; flex-direction:column; overflow:hidden; position:relative; }
  .tabs { display:flex; gap:4px; padding:10px 16px 0; }
  .tabs button { border:1px solid var(--line); border-radius:8px; padding:4px 16px;
                 background:var(--panel); }
  .tabs button.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  #pdfPages { flex:1; overflow:auto; padding:16px; }
  #pdfPages.on { display:block; }
  #pdfPages { display:none; }
  .page { position:relative; margin:0 auto 16px; box-shadow:var(--page-shadow); background:#fff; }
  .page canvas { display:block; max-width:100%; }
  .textLayer { position:absolute; inset:0; overflow:clip; line-height:1; transform-origin:0 0; z-index:0; }
  .textLayer span, .textLayer br { color:transparent; position:absolute; white-space:pre;
                                   cursor:text; transform-origin:0 0; }
  .textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent) {
    z-index:1; --font-height:0; font-size:calc(var(--text-scale-factor) * var(--font-height));
    --scale-x:1; --rotate:0deg;
    transform:rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv)); }
  .textLayer { --min-font-size:1; --text-scale-factor:calc(var(--total-scale-factor) * var(--min-font-size));
               --min-font-size-inv:calc(1 / var(--min-font-size)); }
  .textLayer .markedContent { display:contents; }
  .hl { position:absolute; border-radius:2px; cursor:pointer; z-index:2; mix-blend-mode:multiply;
        transition:outline-color .15s; outline:2px solid transparent; }
  .hl.issue { background:var(--issue); } .hl.strength { background:var(--good); }
  .hl.style { background:transparent; border-bottom:3px solid var(--style-b); border-radius:0; }
  .hl.visual { background:var(--visual); border:1.5px dashed var(--visual-b); }
  .hl.active { outline-color:var(--accent); }
  .hl.dim { opacity:.25; }
  .pagebox { position:absolute; inset:0; pointer-events:none; z-index:2;
             outline:2px dashed var(--visual-b); outline-offset:-8px; opacity:.7; }
  .pagebox.active { outline-color:var(--accent); opacity:1; }
  .pgbadge { font-size:10.5px; padding:0 5px; border-radius:8px; background:var(--visual-b); color:#fff;
             margin-right:5px; vertical-align:1px; }
  #texWrap { display:none; flex:1; min-height:0; flex-direction:column; gap:8px; padding:0 16px 12px; }
  #texWrap.on { display:flex; }
  #edWrap { position:relative; flex:1; min-height:0;
            border:1px solid var(--line); border-radius:8px; overflow:hidden;
            background:var(--panel); }
  #gutter { position:absolute; left:0; top:0; bottom:0; width:46px; overflow:hidden;
            background:var(--bg); border-right:1px solid var(--line); color:var(--dim);
            font:12.5px/19px ui-monospace, Menlo, monospace; text-align:right;
            padding:10px 8px 10px 0; user-select:none; }
  #gutter div { height:19px; }
  #gutter div.cur { color:var(--accent); font-weight:700; }
  #hl, #editor { position:absolute; inset:0; margin:0; padding:10px 10px 10px 56px;
                 border:none; outline:none; white-space:pre; tab-size:2;
                 font:12.5px/19px ui-monospace, Menlo, monospace; }
  #hl { pointer-events:none; overflow:hidden; }
  #hl code, #hl pre { font:inherit; background:none; }
  #hl .token.comment { color:var(--dim); font-style:italic; }
  #hl .token.keyword, #hl .token.tag, #hl .token.command { color:var(--purple); }
  #hl .token.equation, #hl .token.equation-command { color:var(--teal); }
  #hl .token.url { color:var(--accent); text-decoration:underline; }
  #hl .token.operator, #hl .token.bracket, #hl .token.delimiter, #hl .token.string { color:var(--dim); }
  #editor { background:transparent; color:transparent; caret-color:var(--fg);
            resize:none; overflow:auto; }
  #editor::selection { background:rgba(37,99,235,.25); }
  #zoomer { position:absolute; right:18px; bottom:18px; display:none; gap:4px; padding:4px;
            background:var(--panel); border:1px solid var(--line); border-radius:8px;
            box-shadow:var(--page-shadow); z-index:5; }
  #zoomer.on { display:flex; }
  #zoomer button { width:28px; height:26px; padding:0; font-size:14px; }

  /* ---------- right: chat ---------- */
  #chatPane { grid-area:chat; display:flex; flex-direction:column; border-left:1px solid var(--line);
              background:var(--panel); overflow:hidden; }
  #chatlog { flex:1; overflow:auto; padding:12px; }
  .msg { font-size:13px; margin:8px 0; white-space:pre-wrap; overflow-wrap:break-word; }
  .msg.user { color:var(--accent); }
  .msg.assistant { padding-left:10px; border-left:3px solid var(--line); }
  .msg.thinking { display:flex; align-items:center; gap:7px; color:var(--dim); font-size:12px; }
  .msg.assistant h2, .msg.assistant h3, .msg.assistant h4, .msg.assistant h5
    { font-size:13.5px; font-weight:600; margin:10px 0 4px; }
  .msg.assistant p { margin:6px 0; }
  .msg.assistant ul, .msg.assistant ol { margin:6px 0 6px 18px; padding:0; }
  .msg.assistant li { margin:3px 0; }
  .msg.assistant code { font-family:ui-monospace, monospace; font-size:12px;
                         background:var(--bg); border:1px solid var(--line); border-radius:4px;
                         padding:0 3px; }
  .msg.assistant pre { background:var(--bg); border:1px solid var(--line); border-radius:6px;
                       padding:8px 10px; overflow:auto; margin:6px 0; }
  .msg.assistant pre code { border:none; padding:0; background:none; }
  .msg.assistant a { color:var(--accent); }
  .msg.system { display:inline-block; width:100%; box-sizing:border-box; text-align:center;
                color:var(--dim); font-size:11.5px; margin:10px 0; padding:5px 10px;
                background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  #chatResize { flex:0 0 auto; height:12px; cursor:row-resize; user-select:none;
                touch-action:none; position:relative; }
  #chatResize::before { content:""; position:absolute; left:14px; right:14px; top:5px; height:2px;
                        border-radius:1px; background:var(--line); transition:background .15s; }
  #chatResize:hover::before, #chatResize.dragging::before { background:var(--accent); }
  #chatbar { display:flex; gap:6px; align-items:flex-end; padding:4px 12px; }
  #chatinput { flex:1; min-width:0; min-height:34px; max-height:min(200px, 45vh);
               padding:6px 10px; font:inherit; font-size:13px; line-height:1.4;
               resize:none; overflow-y:auto;
               background:var(--bg); color:var(--fg); border:1px solid var(--line);
               border-radius:8px; }
  #chatinput:focus { outline:none; border-color:var(--accent); }
  #sendBtn { width:34px; flex:0 0 34px; display:grid; place-items:center; border-radius:8px; }
  #modelbar { display:flex; gap:6px; padding:8px 12px 10px; }
  #modelbar select { flex:1; min-width:0; font-size:11.5px; padding:4px 6px; background:var(--bg);
                     color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  #modelbar select:hover { border-color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Resume Analyzer</h1>
  <nav id="tabs"></nav>
  <input type="file" id="file" accept=".tex,text/x-tex,text/plain">
  <button id="themeBtn" title="Toggle dark mode">&#9788;</button>
</header>
<div class="wrap">
  <section id="analysis">
    <div class="ph">Upload a .tex to start.</div>
  </section>
  <section id="pdfPane">
    <div class="tabs">
      <button id="tabPdf" class="on">PDF</button>
      <button id="tabTex">Source</button>
    </div>
    <div id="pdfPages" class="on"></div>
    <div id="texWrap">
      <div id="edWrap">
        <div id="gutter"></div>
        <pre id="hl"><code id="hlCode" class="language-latex"></code></pre>
        <textarea id="editor" spellcheck="false" wrap="off"></textarea>
      </div>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <button id="saveTex" style="border-color:var(--accent);color:var(--accent)">Save &amp; Recompile</button>
        <button id="reloadTex">Reload from disk</button>
        <span class="dim" id="texState"></span>
      </div>
    </div>
    <div id="zoomer">
      <button id="zout" title="Zoom out">&#8722;</button>
      <button id="zin" title="Zoom in">+</button>
    </div>
  </section>
  <section id="chatPane">
    <div id="chatlog"></div>
    <div id="chatResize" title="Drag to resize the input"></div>
    <div id="chatbar">
      <textarea id="chatinput" rows="1" enterkeyhint="send"
        placeholder="Ask about this resume, or describe a change&#8230;"
        title="Enter to send &#183; Shift+Enter for a new line"></textarea>
      <button id="sendBtn" title="Send (Enter)"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
    <div id="modelbar">
      <select id="mainSel" title="Main model — analysis, scoring, chat"></select>
      <select id="visionSel" title="Vision model — layout inspection"></select>
    </div>
  </section>
</div>
<script src="/static/vendor/prism/prism-core.min.js"></script>
<script src="/static/vendor/prism/prism-latex.min.js"></script>
<script type="module">
import * as pdfjsLib from '/static/vendor/pdfjs/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = '/static/vendor/pdfjs/pdf.worker.min.mjs';

const $ = id => document.getElementById(id);
const api = (p, o) => fetch(p, o).then(async r => {
  if (r.ok) return r.status === 204 ? null : r.json();
  throw new Error(((await r.json().catch(() => ({}))).detail) || r.statusText);
});
const el = (tag, cls, text) => { const e = document.createElement(tag);
  if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const scoreColor = s => s >= 8 ? '#16a34a' : s >= 6 ? '#d97706' : '#dc2626';

let files = [], selected = null, data = null, dataKey = '';
let zoom = 1.3, activeId = null, filter = 'all';
let pageState = [], pdfFor = null;
let tab = 'pdf', texFor = null, texDirty = false, texLoading = null;
let chatFor = null, chatBusy = false;

// ---------- refresh ----------
async function refresh() {
  try { files = await api('/api/files'); } catch { return; }
  if (selected && !files.some(f => f.name === selected)) {
    selected = null; texFor = null; pdfFor = null; activeId = null; chatFor = null;
  }
  if (!selected && files.length) selected = files[0].name;
  renderTabs();
  if (!selected) {
    $('analysis').innerHTML = '<div class="ph">Upload a .tex to start.</div>';
    $('pdfPages').textContent = ''; $('chatlog').textContent = '';
    return;
  }
  loadTex(selected);
  loadChat();
  if (tab === 'pdf') {
    if (pdfFor !== selected) await renderPdf(selected);
    drawHighlights();
  }
  await loadAnalysis();
}

// ---------- resume tabs ----------
function renderTabs() {
  const nav = $('tabs'); nav.textContent = '';
  for (const f of files) {
    const b = el('button', 'rtab' + (f.name === selected ? ' on' : ''));
    if (f.status === 'running') b.append(el('span', 'spinner'));
    else if (f.status === 'error') {
      const d = el('span', 'doterr'); d.title = f.error || 'Analysis failed'; b.append(d);
    }
    b.append(el('span', 'tname', f.name.replace(/\.pdf$/, '')));
    b.title = f.name + (f.status === 'error' ? ' — ' + (f.error || 'analysis failed') : '');
    const kb = el('span', 'kebab', '\u22ef'); kb.title = 'More actions';
    kb.onclick = e => { e.stopPropagation(); openTabMenu(kb, f); };
    b.append(kb);
    b.onclick = () => { if (f.name !== selected) selectFile(f.name); };
    nav.append(b);
  }
  const plus = el('label', 'rtab plus', '+');
  plus.htmlFor = 'file'; plus.title = 'Upload a .tex resume';
  nav.append(plus);
}

function selectFile(name) {
  selected = name; activeId = null; texFor = null; pdfFor = null; chatFor = null;
  texDirty = false; dataKey = ''; filter = 'all';
  refresh();
}

// ---------- tab kebab menu ----------
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function dl(href, name) {
  const a = el('a'); a.href = href; a.download = name;
  document.body.append(a); a.click(); a.remove();
}
function openTabMenu(anchor, f) {
  closeMenu();
  const m = el('div'); m.id = 'menu'; menuEl = m;
  const enc = encodeURIComponent(f.name);
  const item = (label, fn, danger) => {
    const b = el('button', danger ? 'danger' : '', label);
    b.onclick = () => { closeMenu(); fn(); };
    m.append(b);
  };
  if (f.status !== 'running')
    item('Re-analyze', () => api(`/api/files/${enc}/analyze`, { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: '{}' })
      .then(() => { dataKey = ''; refresh(); }).catch(alert));
  if (f.status === 'done' || f.status === 'error')
    item('Export checklist', () => dl(`/api/files/${enc}/export.md`,
      f.name.replace(/\.pdf$/, '-checklist.md')));
  item('Open PDF', () => window.open(`/api/files/${enc}/pdf`, '_blank'));
  item('Download PDF', () => dl(`/api/files/${enc}/pdf`, f.name));
  if (f.tex)
    item('Download .tex', () => dl(`/api/files/${enc}/tex`, f.name.replace(/\.pdf$/, '.tex')));
  m.append(el('div', 'sep'));
  item('Delete', async () => {
    if (!confirm('Delete ' + f.name + ' and its analyses?')) return;
    await api(`/api/files/${enc}`, { method: 'DELETE' }).catch(alert);
    dataKey = ''; refresh();
  }, true);
  document.body.append(m);
  const r = anchor.getBoundingClientRect();

// ---------- PDF rendering ----------
async function renderPdf(name) {
  pdfFor = name;
  const pages = $('pdfPages'); pages.textContent = '';
  pageState = [];
  let doc;
  try { doc = await pdfjsLib.getDocument({
    // Cache-bust: after a recompile the URL is unchanged but the bytes are
    // new; without this the browser serves the stale PDF and fresh analysis
    // quotes can't anchor, producing bogus "Not located on the PDF" cards.
    url: '/api/files/' + encodeURIComponent(name) + '/pdf?v=' + Date.now() }).promise; }
  catch (e) { pages.append(el('div', 'err', 'Could not load PDF: ' + e.message)); return; }
  if (pdfFor !== name) return;
  const ratio = window.devicePixelRatio || 1;
  for (let n = 1; n <= doc.numPages; n++) {
    const page = await doc.getPage(n);
    const viewport = page.getViewport({ scale: zoom });
    const div = el('div', 'page');
    div.style.width = viewport.width + 'px'; div.style.height = viewport.height + 'px';
    div.style.setProperty('--scale-factor', zoom); div.style.setProperty('--user-unit', 1);
    div.style.setProperty('--total-scale-factor', zoom);
    div.style.setProperty('--scale-round-x', '1px'); div.style.setProperty('--scale-round-y', '1px');
    const canvas = el('canvas');
    canvas.width = Math.floor(viewport.width * ratio); canvas.height = Math.floor(viewport.height * ratio);
    canvas.style.width = viewport.width + 'px'; canvas.style.height = viewport.height + 'px';
    const tl = el('div', 'textLayer');
    div.append(canvas, tl); pages.append(div);
    await page.render({ canvasContext: canvas.getContext('2d'), viewport,
      transform: ratio !== 1 ? [ratio, 0, 0, ratio, 0, 0] : null }).promise;
    const layer = new pdfjsLib.TextLayer({ textContentSource: page.streamTextContent(),
                                           container: tl, viewport });
    await layer.render();
    if (pdfFor !== name) return;
    pageState.push({ div, textDivs: layer.textDivs });

}

// ---------- quote anchoring ----------
// Keep only letters/digits (after ligature expansion): icon glyphs, ligatures,
// quotes, dashes and other punctuation/symbols differ between the model's
// quote and the rendered PDF text layer, so both sides are reduced to the
// same alphanumeric stream before matching.
const LIG = { '\ufb01': 'fi', '\ufb02': 'fl', '\ufb00': 'ff', '\ufb03': 'ffi', '\ufb04': 'ffl',
              '\u2019': "'", '\u2018': "'", '\u201c': '"', '\u201d': '"', '\u2013': '-', '\u2014': '-' };
function normChars(str, spanIdx, out) {
  for (let i = 0; i < str.length; i++) {
    const c = LIG[str[i]] ?? str[i];
    for (const ch of c.toLowerCase()) {
      if (!/[a-z0-9]/.test(ch)) continue;
      out.chars.push(ch); out.map.push([spanIdx, i]);
    }
  }
}
const normQuote = q => (q.match(/[a-zA-Z0-9\u00c0-\u024f\ufb00-\ufb04]/g) || [])
  .map(c => LIG[c] ?? c).join('').toLowerCase()
  .replace(/[^a-z0-9]/g, '');

function boxesFor(quote) {
  const full = normQuote(quote); if (!full) return [];
  // Quotes sometimes mix lines (two-column headings flattened by the model),
  // so if the full quote doesn't match, fall back to its longest leading
  // chunk that does — at least the found part gets highlighted.
  const probes = [full];
  for (const frac of [0.8, 0.6, 0.45]) {
    const n = Math.floor(full.length * frac);
    if (n >= 16) probes.push(full.slice(0, n));
  }
  for (const ps of pageState) {
    const out = { chars: [], map: [] };
    ps.textDivs.forEach((d, i) => normChars(d.textContent, i, out));
    const hay = out.chars.join('');
    const q = probes.find(p => hay.includes(p));
    if (!q) continue;
    const at = hay.indexOf(q);
    const bySpan = new Map();
    for (let k = at; k < at + q.length; k++) {
      const [s, i] = out.map[k]; const r = bySpan.get(s) || [i, i];
      r[0] = Math.min(r[0], i); r[1] = Math.max(r[1], i); bySpan.set(s, r);
    }
    const pageRect = ps.div.getBoundingClientRect(), boxes = [];
    for (const [s, [a, b]] of bySpan) {
      const node = ps.textDivs[s].firstChild; if (!node) continue;
      const range = document.createRange();
      range.setStart(node, a); range.setEnd(node, Math.min(b + 1, node.length));
      for (const r of range.getClientRects()) {
        if (r.width < 1) continue;
        boxes.push({ page: ps.div, x: r.left - pageRect.left - 1, y: r.top - pageRect.top - 1,
                     w: r.width + 2, h: r.height + 2 });
      }
    }
    return boxes;
  }
  return [];
}

function drawHighlights() {
  document.querySelectorAll('.hl, .pagebox').forEach(h => h.remove());
  if (!data?.analysis || !pageState.length || pdfFor !== selected) return;
  for (const f of data.analysis.findings) {
    if (filter !== 'all' && f.type !== filter) continue;
    const boxes = boxesFor(f.quote);
    f._placed = boxes.length > 0;
    for (const b of boxes) {
      const h = el('div', 'hl ' + f.type + (activeId && activeId !== f.id ? ' dim' : '')
                        + (activeId === f.id ? ' active' : ''));
      Object.assign(h.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px' });
      h.title = f.title; h.dataset.id = f.id;
      h.onclick = () => focusFinding(f.id, false);
      b.page.append(h);
    }
    if (f.type === 'visual' && !f._placed) {
      const page = pageState[Math.min((f.page || 1) - 1, pageState.length - 1)];
      if (page) {
        const pb = el('div', 'pagebox' + (activeId === f.id ? ' active' : ''));
        pb.title = f.title; pb.onclick = () => focusFinding(f.id, false);
        page.div.append(pb); f._placed = true;
      }
    }
  }
  document.querySelectorAll('.card').forEach(c => {
    const f = data.analysis.findings.find(x => x.id === c.dataset.id);
    // Show the badge only when a real quote failed to anchor; empty quotes

    c.querySelector('.unanchored').hidden = !f || !f.quote || f.type === 'visual'

}

// Jump the editor to a finding's .tex source line.
const stripTex = ln => ln.replace(/%.*$/, '').replace(/\\[a-zA-Z]+\*?(\[[^\]]*\])?(\{[^}]*\})?/g, ' ')
                        .replace(/[{}$&~^_]/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
function texLineFallback(quote) {
  const src = $('editor').value.split('\n');
  const q = normQuote(quote); if (!q) return -1;
  const probe = q.slice(0, 60);
  for (let i = 0; i < src.length; i++) {
    const norm = stripTex(src[i]).replace(/\s+/g, '');
    if (norm && (norm.includes(probe) || (probe.length > 12 && norm.includes(probe.slice(0, 30)))))
      return i;
  }
  const words = q.slice(0, 80).split(/(?![\w])/).filter(w => w.length > 3).slice(0, 6);
  let best = -1, bestScore = 0;
  for (let i = 0; i < src.length; i++) {
    const norm = stripTex(src[i]);
    const score = words.filter(w => norm.includes(w)).length;
    if (score > bestScore) { bestScore = score; best = i; }
  }
  return bestScore >= 2 ? best : -1;
}

async function jumpToSource(f) {
  setTab('tex');
  await loadTex(selected);
  const ed = $('editor');
  let i = typeof f.tex_line === 'number' && f.tex_line > 0 ? f.tex_line - 1 : -1;
  if (i < 0) i = f.quote ? texLineFallback(f.quote) : -1;
  $('gutter').querySelectorAll('.cur').forEach(n => n.classList.remove('cur'));
  if (i < 0) { $('texState').textContent = 'Could not locate this quote in the source.'; return; }
  const lines = ed.value.split('\n');
  const off = lines.slice(0, i).reduce((a, l) => a + l.length + 1, 0);
  ed.focus();
  ed.setSelectionRange(off, off + (lines[i]?.length || 0));
  const lineEl = $('gutter').children[i];
  if (lineEl) lineEl.classList.add('cur');
  ed.scrollTop = Math.max(0, (i + 0.5) * 19 - ed.clientHeight / 2);
  $('texState').textContent = 'Line ' + (i + 1);
}

function focusFinding(id, fromCard) {
  activeId = activeId === id ? null : id;
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', c.dataset.id === activeId));
  drawHighlights();
  if (!activeId) return;
  if (tab === 'tex') {
    const f = data?.analysis?.findings.find(x => x.id === id);
    if (f) jumpToSource(f);
    return;
  }
  if (fromCard) document.querySelector(`.hl[data-id="${id}"]`)?.scrollIntoView({ behavior:'smooth', block:'center' });
  else document.querySelector(`.card[data-id="${id}"]`)?.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

async function loadAnalysis() {

  catch { d = { name: selected, status: 'new' }; }

  if (key === dataKey) return;

async function applyFinding(fid) {
  // Optimistic: drop the card + finding from local state at once; the server
  // mirrors this in the stale analysis and reports "running". Compile +
  // re-analysis stay in the background.
  document.querySelector(`.card[data-id="${fid}"]`)?.remove();
  if (data?.analysis?.findings)
    data.analysis.findings = data.analysis.findings.filter(f => f.id !== fid);
  drawHighlights();
  try {
    const r = await api('/api/files/' + encodeURIComponent(selected) + '/apply', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ finding_id: fid }) });
    if (r.source != null && !texDirty) {
      $('editor').value = r.source; texFor = selected; texDirty = false; renderHl();
    }
    chatFor = null;
    await loadChat();  // picks up the persisted "Suggestion applied" system card
    dataKey = ''; refresh();
  } catch (e) {
    chatFor = null; addMsg('system', 'Suggestion not applied: ' + (e.message || e));
    dataKey = ''; refresh();  // restore the card / pick up a re-analysis

}

function renderAnalysis() {
  const p = $('analysis');

  const a = d.analysis;
  if (d.status === 'running') {

    r.append(el('span', '', sec.name), tr, el('span', '', isNaN(v) ? '?' : v + '/10')); bars.append(r);
  }

  const counts = { all: a.findings.length };

// ---------- chat (right panel) ----------
async function loadChat() {
  if (!selected || chatFor === selected) return;
  chatFor = selected;
  const log = $('chatlog'); log.textContent = '';
  try {
    for (const msg of await api('/api/files/' + encodeURIComponent(selected) + '/chat'))
      addMsg(msg.role, msg.content);

// Minimal, XSS-safe markdown renderer for chat messages: escapes HTML first,
// then converts headings, bold/italic, inline code, fenced code, lists, links.
const mdEscape = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function mdInline(s) {
  return s
    .replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const esc = mdEscape(src);
  const out = [];
  let inCode = false, codeBuf = [], listType = null;
  const closeList = () => { if (listType) { out.push(listType === 'ol' ? '</ol>' : '</ul>'); listType = null; } };
  for (const line of esc.split('\n')) {
    if (line.startsWith('```')) {
      if (inCode) { out.push('<pre><code>' + codeBuf.join('\n') + '</code></pre>'); codeBuf = []; }
      closeList();
      inCode = !inCode;
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); const n = h[1].length + 1; out.push(`<h${n}>${mdInline(h[2])}</h${n}>`); continue; }
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ul || ol) {
      const want = ul ? 'ul' : 'ol';
      if (listType !== want) { closeList(); out.push('<' + want + '>'); listType = want; }
      out.push('<li>' + mdInline((ul || ol)[1]) + '</li>');
      continue;
    }
    closeList();
    if (line.trim()) out.push('<p>' + mdInline(line.trim()) + '</p>');
  }
  if (inCode && codeBuf.length) out.push('<pre><code>' + codeBuf.join('\n') + '</code></pre>');
  closeList();
  return out.join('');
}
function addMsg(role, text) {
  const log = $('chatlog');
  const div = el('div', 'msg ' + role);
  if (role === 'assistant') div.innerHTML = md(text);
  else div.textContent = text;
  log.append(div);
  log.scrollTop = log.scrollHeight;
}
async function sendMsg() {
  const inp = $('chatinput');
  const msg = inp.value.trim();
  if (!msg || !selected || chatBusy) return;
  inp.value = ''; autoGrowChat();
  chatBusy = true; $('sendBtn').disabled = true;
  addMsg('user', msg);
  // "Thinking…" bubble with spinner while the model works
  const log = $('chatlog');
  const think = el('div', 'msg assistant thinking');
  think.append(el('span', 'spinner'), ' thinking\u2026');
  log.append(think); log.scrollTop = log.scrollHeight;
  try {
    const r = await api('/api/files/' + encodeURIComponent(selected) + '/chat', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg }) });
    think.remove();
    addMsg('assistant', r.reply);
    if (r.applied && r.source != null && !texDirty) {
      $('editor').value = r.source; texFor = selected; texDirty = false; renderHl();
    }
  } catch (e) {

  const t = $('chatinput');
  const prevH = t.style.height, prevMin = t.style.minHeight;
  t.style.minHeight = '0'; t.style.height = 'auto';
  const need = t.scrollHeight + 2;
  t.style.height = prevH; t.style.minHeight = prevMin;
  return need;
}
function setChatH(h) {
  const t = $('chatinput');
  const max = chatMax(t);
  t.style.height = Math.min(h, max) + 'px';
  t.style.overflowY = t.scrollHeight + 2 > max ? 'auto' : 'hidden';
}
// Auto-grow with the content, but never below the height the user chose by
// dragging the resize line, and never above the CSS max-height.
function autoGrowChat() {
  setChatH(Math.max(chatNeedH(), chatUserH));
}
const chatResize = $('chatResize');
chatResize.addEventListener('pointerdown', e => {
  e.preventDefault();
  chatResize.setPointerCapture(e.pointerId);
  chatResize.classList.add('dragging');
  const t = $('chatinput');
  const startY = e.clientY, startH = t.offsetHeight;
  const min = chatNeedH(), max = chatMax(t);
  const move = ev => setChatH(Math.max(min, Math.min(max, startH + startY - ev.clientY)));
  const end = () => {
    chatResize.classList.remove('dragging');
    chatResize.removeEventListener('pointermove', move);
    chatResize.removeEventListener('pointerup', end);
    chatResize.removeEventListener('pointercancel', end);
    chatUserH = t.offsetHeight;  // remember the drag as the auto-grow floor
  };
  chatResize.addEventListener('pointermove', move);
  chatResize.addEventListener('pointerup', end);
  chatResize.addEventListener('pointercancel', end);
});
$('sendBtn').onclick = sendMsg;
$('chatinput').addEventListener('input', autoGrowChat);
$('chatinput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

// ---------- model dropdowns (chat bottom bar) ----------
function fillSelect(sel, models, current, wantImage) {
  const imgs = models.filter(m => m.image);
  const list = wantImage ? (imgs.length ? imgs : models) : models;
  sel.textContent = '';
  const seen = new Set();
  if (current && !list.some(m => m.id === current))
    sel.append(new Option(current, current, true, true));  // configured but unlisted
  for (const m of list) {
    if (seen.has(m.id)) continue; seen.add(m.id);
    sel.append(new Option(m.id, m.id));
  }
  if (current) sel.value = current;
}
async function loadModels() {
  let models = [];
  try { models = await api('/api/models'); } catch { /* offline */ }
  let s = {};
  try { s = await api('/api/settings'); } catch { /* defaults */ }
  fillSelect($('mainSel'), models, s.main_model, false);
  fillSelect($('visionSel'), models, s.vision_model, true);
}
for (const sel of [$('mainSel'), $('visionSel')]) {
  sel.addEventListener('change', () => {
    api('/api/settings', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ main_model: $('mainSel').value, vision_model: $('visionSel').value }) })
      .catch(e => { alert(e.message || e); loadModels(); });
  });
}
loadModels();

// ---------- websocket ----------
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  let ping = null, missed = 0;
  ws.onopen = () => {
    missed = 0;
    // Heartbeat: the server ignores the payload; a dead socket fails the
    // send or never answers and we reconnect instead of waiting silently.
    ping = setInterval(() => {
      if (ws.readyState !== WebSocket.OPEN) return;
      if (++missed > 2) { ws.close(); return; }
      try { ws.send('ping'); } catch { ws.close(); }
    }, 15000);
  };
  ws.onmessage = e => {
    missed = 0;
    const m = JSON.parse(e.data);
    if (m.type === 'recompiled' && m.name === selected) {
      if (!texDirty) texFor = null;  // reload the recompiled source (reverts on failure)
      pdfFor = null;                 // re-render the new PDF
    }
    dataKey = '';
    chatFor = null;  // pick up system notices
    refresh();
  };
  ws.onclose = () => {
    clearInterval(ping);
    setTimeout(connectWS, 2000);
  };
}
connectWS();

// ---------- dark mode ----------
const setTheme = t => {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('theme', t);
  $('themeBtn').textContent = t === 'dark' ? '\u2600' : '\u263e';
};
setTheme(localStorage.getItem('theme') ||
  (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

// ---------- boot ----------
window.addEventListener('resize', () => { autoGrowChat(); drawHighlights(); });
autoGrowChat();
const loop = () => refresh().finally(() =>
  setTimeout(loop, (!files.length || files.some(f => f.status === 'running')) ? 2000 : 15000));
loop();
</script>
